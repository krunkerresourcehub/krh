name: Verify Krunker Account

# Triggered by supabase/functions/verify-krunker-account.ts calling
# POST https://api.github.com/repos/<owner>/<repo>/dispatches with
# event_type "krunker-verify". Needs these repo secrets (Settings >
# Secrets and variables > Actions):
#   KRUNKER_CALLBACK_URL    — e.g. https://<project-ref>.supabase.co/functions/v1/krunker-verification-callback
#   KRUNKER_CALLBACK_SECRET — must match the Supabase Edge Function secret of the same name
on:
  repository_dispatch:
    types: [krunker-verify]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Puppeteer
        run: npm install puppeteer@22

      - name: Run verification check
        env:
          KRUNKER_USERNAME: ${{ github.event.client_payload.krunker_username }}
          TOKEN_HASH: ${{ github.event.client_payload.token_hash }}
          CHALLENGE_ID: ${{ github.event.client_payload.challenge_id }}
          CONNECTION_ID: ${{ github.event.client_payload.connection_id }}
          CALLBACK_URL: ${{ secrets.KRUNKER_CALLBACK_URL }}
          CALLBACK_SECRET: ${{ secrets.KRUNKER_CALLBACK_SECRET }}
        run: node scripts/verify-krunker-check.mjs

      - name: Upload debug screenshot + page text (temporary, every run)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: krunker-debug-${{ github.event.client_payload.challenge_id }}
          path: |
            debug-screenshot.png
            debug-page-text.txt
          if-no-files-found: ignore
          retention-days: 3
